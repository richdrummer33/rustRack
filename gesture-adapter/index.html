<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Rack Touch Adapter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <span id="status" class="status status-disconnected">disconnected</span>
    <span id="mode"></span>
    <button id="toggleLog" type="button">log</button>
  </header>

  <svg id="scene" preserveAspectRatio="xMidYMid meet"></svg>

  <aside id="logPanel" hidden>
    <ol id="log"></ol>
  </aside>

  <div id="actionSheet" hidden>
    <div class="action-backdrop"></div>
    <div class="action-card">
      <header id="actionHeader">Module</header>
      <button class="action" data-action="bypass">Bypass</button>
      <button class="action" data-action="disconnect">Disconnect cables</button>
      <button class="action" data-action="reset">Reset</button>
      <button class="action" data-action="randomize">Randomize</button>
      <button class="action" data-action="clone">Duplicate</button>
      <button class="action danger" data-action="delete">Delete</button>
      <button class="action cancel" data-action="">Cancel</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
